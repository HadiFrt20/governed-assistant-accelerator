# Governed Assistant Accelerator: deployment settings (one file per environment).
# Everything deployed (Databricks Asset Bundle in bundle/) and everything the app reads comes from here and from the brand pack.

workspace:
  profile: DEFAULT                 # Databricks CLI profile used to deploy (databricks auth login -p <name>)
  warehouse_id: <warehouse-id>     # SQL warehouse for setup SQL, trace queries and the dashboard

brand: acme                       # folder under brands/

unity_catalog:
  catalog: main                    # must exist; the bundle creates the schemas inside it
  schema: acme_assistant           # model services, policy function, history mirror, gold layer
  # traces_schema: acme_assistant_traces   # MLflow trace tables (default <schema>_traces): the only schema the app may write to
  volume: fichiers                # personal files: generated/ (deliverables) and uploads/ (attachments), mediated by the app

app:
  name: acme-assistant            # Databricks App name (lowercase, dashes)
  obo: true                       # run model, Genie One and SQL calls with the signed-in user's identity

access:
  users_group: account users      # may open the app and call the model services (EXECUTE); use a narrower group in production

libraries:                        # shared document libraries, one UC volume each; Unity Catalog decides who reads which one
  - name: bibliotheque
    label: Bibliothèque
    # readers: <group>               # default: access.users_group
    # curators: <group or e-mail>    # may add documents (WRITE VOLUME); default: the person who deploys

documents:
  parser: auto                    # auto = Databricks ai_parse_document (text, tables, figures, pages) with built-in readers as fallback; builtin = built-in only

models:
  # Governed model services created in Unity AI Gateway. The office assistant uses `assistant`.
  assistant:
    service: assistant_bureautique
    model: system.ai.databricks-claude-sonnet-5-5
  developer:                      # optional: coding agents (Codex CLI, Claude Code) through the same gateway
    service: assistant_dev
    model: system.ai.databricks-gpt-5-6-terra
  max_output_tokens: 64000
  effort: medium

governance:
  rate_limit_per_user_per_minute: 60
  ip_leak_policy:                 # custom UC function policy: DENY when any keyword appears in a request
    name: anti-fuite-pi
    keywords: ["confidentiel r&d", "iso-10303-21", "file_schema"]
    reason: "Document de propriété intellectuelle (plan CAO, R&D confidentiel) : envoi interdit hors du périmètre autorisé."
  builtin_policies:               # Databricks built-in guardrails
    jailbreak: true
    unsafe_content: true
    sensitive_data:               # anonymisation (redact) before the model sees the request
      action: transform
      categories: [class.email_address, class.phone_number, class.iban_code, class.credit_card]

data:
  genie_one: true                 # data questions go to Genie One (system.ai.genie_one_mcp) with the user's rights
  scope: "Décrivez ici les tables métier que Genie One peut interroger (ex. catalog.schema.table : contenu)."

observability:
  mlflow_experiment: /Shared/acme-assistant-traces   # linked to UC trace tables <catalog>.<traces_schema>.assistant_*
  usage_job_cron: "0 5 * * * ?"   # hourly gold layer refresh (ai_classify of usages)
  timezone: Europe/Paris

pricing:                          # USD per million tokens (input, output); Anthropic list prices 2026-10, validate against your contract
  claude-sonnet-5-5: [2.0, 10.0]
  claude-opus-5-5: [4.0, 20.0]
  default: [2.0, 10.0]
